<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Контактна інформація та форма зворотного зв'язку." />
  <title>Лабораторна 2 - Контакти</title>
  <link rel="icon" href="assets/images/favicon.ico" />
</head>
<body>

  <a class="skip-link" href="#main">Перейти до основного контенту</a>

  <header class="site-header">
    <h1>Мій перший лендінг</h1>
    <nav aria-label="Головна навігація">
      <ul class="nav-list">
        <li><a href="index.html">Головна</a></li>
        <li><a href="about.html">Про нас</a></li>
        <li><a href="contacts.html" aria-current="page">Контакти</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <h2>Контакти</h2>

    <form action="#" method="post">

      <div class="form-row">
        <label for="name">Ім'я:</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Введіть ваше ім'я"
          required
          minlength="2"
          maxlength="50"
          pattern="[А-Яа-яЇїІіЄєҐґA-Za-z'\- ]+"
          title="Дозволені літери, пробіл, тире та апостроф (2–50 символів)"
        />
      </div>

      <div class="form-row">
        <label for="email">Email:</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="form-row">
        <label for="phone">Телефон:</label>
        <input
          type="tel"
          id="phone"
          name="phone"
          placeholder="+380XXXXXXXXX"
          required
          pattern="^\+380\d{9}$"
          title="Формат: +380XXXXXXXXX"
        />
      </div>

      <div class="form-row">
        <label for="message">Коментар:</label>
        <textarea
          id="message"
          name="message"
          rows="5"
          placeholder="Ваше повідомлення..."
        ></textarea>
      </div>

      <div class="form-row">
        <button type="submit">Надіслати</button>
      </div>

    </form>

    <section aria-labelledby="contacts-title">
      <h3 id="contacts-title">Наші контакти</h3>
      <ul>
        <li>Email: <a href="mailto:student@example.com">student@example.com</a></li>
        <li>Телефон: <a href="tel:+380XXXXXXXXX">+380631873245</a></li>
        <li>Адреса: м. Київ, вул. Велика, 7</li>
      </ul>
    </section>
  </main>

  <aside class="social">
    <h3>Соціальні мережі</h3>
    <ul>
      <li><a href="https://github.com/AtamanAtam/web" target="_blank" rel="noopener noreferrer">GitHub</a></li>
      <li><a href="https://t.me/Atamanfrez" target="_blank" rel="noopener noreferrer">Telegram</a></li>
      <li><a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a></li>
    </ul>
  </aside>

  <footer class="site-footer">
    <p>© 2026 Група 6.1214-пі-1</p>
  </footer>

</body>
</html>
